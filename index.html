<style>
/* 한 손 세로 앱: 위 고정 머리(검색·분류·지역) + 카드 목록 + 아래 탭 줄 */
:root{
  --bg:#121014;--panel:#1c191f;--line:#2e2a33;--fg:#efe9e4;--mute:#9d95a3;--acc:#e0453a;--acc2:#ffd23f;--link:#9fd0ff;--ok:#a6e8c2;--warn:#ffcf80;--mkbg:#e6c35c;--mint:#8fd6c1;--mint-fg:#a9e3d2;--mint-bd:#3c6b5f;--mkfg:#1d1708;--mkbd:#e6c35c;
  --disp:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;--body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2ef;--panel:#fff;--line:#e4dcd6;--fg:#1d1a1f;--mute:#6f6873;--acc:#c8352b;--acc2:#b07d00;--link:#1f63b8;--ok:#247a4c;--warn:#8a5a00;--mkbg:#f0cf5e;--mint:#8fd6c1;--mint-fg:#1f6b57;--mint-bd:#9fd3c4;--mkfg:#1d1708;--mkbd:#d9b545;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f2ef;--panel:#fff;--line:#e4dcd6;--fg:#1d1a1f;--mute:#6f6873;--acc:#c8352b;--acc2:#b07d00;--link:#1f63b8;--ok:#247a4c;--warn:#8a5a00;--mkbg:#f0cf5e;--mint:#8fd6c1;--mint-fg:#1f6b57;--mint-bd:#9fd3c4;--mkfg:#1d1708;--mkbd:#d9b545;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--acc);padding-block:10px 8px}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{margin:0;font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.01em;color:var(--acc)}
#cnt{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.sr{position:relative;margin-top:8px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}

.chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c,var(--acc))}
.chip b{color:var(--mute);font-weight:600;margin-left:4px}
.chip.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff;font-weight:700}.chip.on i{background:#fff}.chip.on b{color:#fff}

.chip.reg{border-color:var(--mint-bd);color:var(--mint-fg)}.chip.reg b{color:var(--mint-fg);opacity:.75}
.chip.reg.on{background:var(--mint);border-color:var(--mint);color:#10241e;font-weight:700}.chip.reg.on b{color:#10241e;opacity:1}
main{display:flex;flex-direction:column;gap:10px;padding-block:12px}

h3{margin:6px 0 0;font-size:18px;line-height:1.35;text-wrap:balance}

.more{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:2px 0}
.cu{font-size:13px;color:var(--warn);margin-top:6px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.acts a{display:block;text-align:center;padding:8px 4px;border-radius:10px;background:var(--line);color:var(--ok);text-decoration:none;font-size:13px;font-weight:600}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src a{color:var(--link);font-size:13px;text-decoration:none;border-bottom:1px solid currentColor;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk{display:flex;gap:6px;margin-top:10px}
.mk button{flex:1;border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:10px;padding:7px;font:inherit;font-size:13px}
.mk .fv.on{border-color:var(--acc2);color:var(--acc2);font-weight:700}.mk .xb.on{border-color:var(--mute);color:var(--fg);font-weight:700}
mark{background:var(--mkbg);color:var(--mkfg);box-shadow:inset 0 0 0 1px var(--mkbd);border-radius:4px;padding:0 3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.empty{color:var(--mute);text-align:center;padding:40px 0}
#more{height:40px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:10px 0 12px}
nav button b{display:block;font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
nav button.on{color:var(--acc)}
#top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px}
.maker{color:var(--mute);font-size:11px;letter-spacing:.18em}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

 if(L(it.n).includes(w))sc+=100;else if(L(it.rm).includes(w))sc+=60;else if(L(it.r+" "+it.ci).includes(w))sc+=40;else if(L(it.a).includes(w))sc+=30;else if(L(it.c+" "+it.t).includes(w))sc+=20;else sc+=5});return sc}
function snip(v){const t=terms();if(!t.length)return v;const L=v.toLowerCase();let i=Math.min(...t.map(w=>{const k=L.indexOf(w);return k<0?1e9:k}));
 return i>40&&i<1e9?"…"+v.slice(i-25):v}

function card(it){
  const q2=encodeURIComponent(it.n+" "+it.ci),bad=/폐업|철거|출입금지/.test(it.st);

function run(keep){
  res=D.items.filter(it=>base(it)&&match(it)&&(!reg||it.r===reg));if(q){res.forEach(it=>it._sc=score(it));res.sort((a,b)=>b._sc-a._sc)}
  if(!keep){shown=0;$("#list").innerHTML="";}

  more();chips();}

new IntersectionObserver(e=>{if(e[0].isIntersecting&&shown<res.length)more()},{rootMargin:"600px"}).observe($("#more"));

 tm=setTimeout(()=>{if(v===lastQ)return;lastQ=q=v;run();scrollTo(0,0)},now?0:250)}

$("#regs").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;reg=b.dataset.r;run();scrollTo(0,0)};

$("#list").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const it=D.items[+c.dataset.i];
  if(e.target.closest(".more")){c.classList.toggle("open");c.querySelector(".story").innerHTML=hl(c.classList.contains("open")?it.s:snip(it.s));e.target.textContent=c.classList.contains("open")?"접기":"더 보기";return}
  const fv=e.target.closest(".fv"),xb=e.target.closest(".xb");if(!fv&&!xb)return;
  const S=fv?F:X,k=fv?"onestar_f":"onestar_x";S.has(it.id)?S.delete(it.id):S.add(it.id);save(k,S);
  if(fv){fv.classList.toggle("on",F.has(it.id));fv.textContent=F.has(it.id)?"★ 찜함":"☆ 찜"}
  else{xb.classList.toggle("on",X.has(it.id));xb.textContent=X.has(it.id)?"제외됨":"제외";c.classList.toggle("xd",X.has(it.id))}
  $("#nf").textContent=F.size;$("#nx").textContent=X.size;};
addEventListener("scroll",()=>{$("#top").hidden=scrollY<800},{passive:true});$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
